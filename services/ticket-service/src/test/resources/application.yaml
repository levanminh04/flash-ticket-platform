spring:
  application:
    name: ticket-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:1/isolated-ticket-realm
          jwk-set-uri: http://127.0.0.1:1/isolated-ticket-realm/certs
          audiences:
            - flash-ticket-api
# Test-only isolation: production configuration is bundled in the service YAML and
# requires the real PostgreSQL, RabbitMQ, and mail endpoints.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
      - org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration

eureka:
  client:
    enabled: false
