server:
  port: ${ASSISTANT_SERVICE_PORT}
spring:
  application:
    name: assistant-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
assistant:
  model:
    base-url: ${ASSISTANT_MODEL_BASE_URL}
    api-key: ${ASSISTANT_MODEL_API_KEY}
    name: ${ASSISTANT_MODEL_NAME}
  event-base-url: ${ASSISTANT_EVENT_BASE_URL}
  booking-base-url: ${ASSISTANT_BOOKING_BASE_URL}
  redis-key-prefix: ${ASSISTANT_REDIS_KEY_PREFIX}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  level:
    dev.langchain4j: OFF
    org.springframework.web.client: WARN
