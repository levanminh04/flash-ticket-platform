spring:
  application:
    name: payment-service
  security:
    oauth2:
      client:
        registration:
          booking:
            provider: booking
            client-id: payment-test
            client-secret: test-only
            authorization-grant-type: client_credentials
        provider:
          booking:
            token-uri: http://127.0.0.1:1/not-used
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
# Test-only isolation: production configuration comes from Config Server and
# requires the real PostgreSQL and RabbitMQ endpoints.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration

eureka:
  client:
    enabled: false

payment:
  worker:
    enabled: false
  booking:
    base-url: https://booking.example.test

flashticket:
  payment:
    jwt:
      issuer-uri: https://issuer.example.test
      jwk-set-uri: http://127.0.0.1:1/not-used-by-smoke-tests
      audience: payment

vnpay:
  tmn-code: test
  hash-secret: fixture-secret
  payment-url: https://sandbox.example.test/pay
  return-url: https://example.test/api/v1/payments/vnpay/return
  ipn-url: https://example.test/api/v1/payments/vnpay/ipn
  app-return-url: flash-ticket://payment-return
