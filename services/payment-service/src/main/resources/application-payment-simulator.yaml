# Explicit local-only runtime. JWT verification remains enabled.
spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://127.0.0.1:5443/payment_db?currentSchema=pg_catalog}
    username: ${PAYMENT_DB_USERNAME:payment_app}
    password: ${PAYMENT_DB_PASSWORD:simulator-local-only}
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment_schema
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5679}
    username: ${RABBITMQ_USERNAME:payment_simulator}
    password: ${RABBITMQ_PASSWORD:simulator-local-only}
    virtual-host: ${RABBITMQ_VHOST:/}
    dynamic: false
server:
  port: ${PAYMENT_SERVICE_PORT:8083}
eureka:
  client:
    enabled: false
flashticket:
  payment:
    vnpay:
      enabled: ${PAYMENT_VNPAY_ENABLED:false}
      callbacks-enabled: false
      refund-enabled: false
      tmn-code: ${PAYMENT_VNPAY_TMN_CODE:}
      hash-secret: ${PAYMENT_VNPAY_HASH_SECRET:}
      return-url: ${PAYMENT_VNPAY_RETURN_URL:}
      ipn-url: ${PAYMENT_VNPAY_IPN_URL:}
      sandbox-payer-ip: ${PAYMENT_VNPAY_SANDBOX_PAYER_IP:127.0.0.1}
      api-client-ip: ${PAYMENT_VNPAY_API_CLIENT_IP:127.0.0.1}
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
      audience: ${KEYCLOAK_AUDIENCE}
