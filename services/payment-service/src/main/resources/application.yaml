server:
  port: ${PAYMENT_SERVICE_PORT:8083}

spring:
  application:
    name: payment-service
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment_schema
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME:payment_admin}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      # Để JDBC trả tên domain nhất quán với columnDefinition trong entity.
      schema: payment_schema
      connection-init-sql: SET ROLE payment_owner
      maximum-pool-size: 5
      minimum-idle: 1
  security:
    oauth2:
      client:
        registration:
          booking:
            provider: booking
            client-id: ${PAYMENT_SERVICE_CLIENT_ID:internal-service}
            client-secret: ${PAYMENT_INTERNAL_SERVICE_CLIENT_SECRET:${PAYMENT_SERVICE_CLIENT_SECRET}}
            authorization-grant-type: client_credentials
        provider:
          booking:
            token-uri: ${KEYCLOAK_TOKEN_URI:${PAYMENT_SERVICE_TOKEN_URI}}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:flash_ticket_app}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    dynamic: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      exchange: ${RABBITMQ_BUSINESS_EXCHANGE:business.ex}
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20

payment:
  booking:
    discovery-enabled: ${PAYMENT_BOOKING_DISCOVERY_ENABLED:false}
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8082}
    snapshot-path: /internal/v1/orders/{orderId}/purchase-snapshot
    connect-timeout: PT3S
    read-timeout: PT5S
  exchange: ${RABBITMQ_BUSINESS_EXCHANGE:business.ex}
  queues:
    finance-configured: payment.finance-configured.q
    event-cancelled: payment.event-cancelled.q
    decision: payment.decision.q
    issuance: payment.ticket-issuance-failed.q
    completed: payment.order-completed.q

flashticket:
  payment:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
      audience: ${KEYCLOAK_AUDIENCE:flash-ticket-api}

vnpay:
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  server-ip: ${VNPAY_SERVER_IP:127.0.0.1}
  refund-create-by: ${VNPAY_REFUND_CREATE_BY:flash-ticket}
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL:}
  app-return-url: ${VNPAY_APP_RETURN_URL:flash-ticket://payment-return}
  version: 2.1.0
  command: pay
  currency-code: VND
  locale: vn

logging:
  charset:
    console: UTF-8
  level:
    root: WARN
    com.flashticket: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.netflix: WARN
    io.lettuce: WARN
    org.apache: WARN
  structured:
    format:
      console: logstash
    json:
      customizer: com.flashticket.payment_service.observability.LogFields
      stacktrace:
        printer: com.flashticket.payment_service.observability.SafeStackTracePrinter

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
