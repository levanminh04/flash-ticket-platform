spring:
  application:
    name: payment-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  security:
    oauth2:
      client:
        registration:
          booking:
            provider: booking
            client-id: ${PAYMENT_SERVICE_CLIENT_ID:payment-service}
            client-secret: ${PAYMENT_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          booking:
            token-uri: ${PAYMENT_SERVICE_TOKEN_URI}
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

payment:
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
    snapshot-path: /internal/v1/orders/{orderId}/purchase-snapshot
    connect-timeout: PT3S
    read-timeout: PT5S
  exchange: flash-ticket.v1
