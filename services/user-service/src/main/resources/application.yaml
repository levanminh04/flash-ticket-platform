server:
  port: ${USER_SERVICE_PORT:8085}

spring:
  application:
    name: user-service
  servlet:
    multipart:
      max-file-size: ${USER_IMAGE_MAX_FILE_SIZE:2MB}
      max-request-size: ${USER_IMAGE_MAX_REQUEST_SIZE:3MB}

  mongodb:
    uri: ${USER_MONGO_URI:${MONGO_URI}}
  data:
    mongodb:
      auto-index-creation: false
  rabbitmq:
    host: ${USER_RABBITMQ_HOST:${RABBITMQ_HOST}}
    port: ${USER_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${USER_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:flash_ticket_app}}
    password: ${USER_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD}}
    virtual-host: ${USER_RABBITMQ_VHOST:${RABBITMQ_VHOST:/}}
    connection-timeout: 2s
    dynamic: false
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${USER_KEYCLOAK_ISSUER_URI:${KEYCLOAK_ISSUER_URI}}
          jwk-set-uri: ${USER_KEYCLOAK_JWK_SET_URI:${KEYCLOAK_JWK_SET_URI}}
          audiences:
            - ${USER_KEYCLOAK_AUDIENCE:${KEYCLOAK_AUDIENCE:flash-ticket-api}}

logging:
  charset:
    console: UTF-8
  level:
    root: WARN
    com.flashticket: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.netflix: WARN
    io.lettuce: WARN
    org.apache: WARN
  structured:
    format:
      console: logstash
    json:
      customizer: com.flashticket.user_service.observability.UserLogCustomizer
      stacktrace:
        printer: com.flashticket.user_service.observability.SafeStackTracePrinter

user:
  images:
    cloud-name: ${USER_IMAGE_CLOUD_NAME:}
    api-key: ${USER_IMAGE_API_KEY:}
    api-secret: ${USER_IMAGE_API_SECRET:}
    folder: ${USER_IMAGE_FOLDER:flash-ticket/organizers}
    max-bytes: ${USER_IMAGE_MAX_BYTES:2097152}
    max-pixels: ${USER_IMAGE_MAX_PIXELS:16000000}
    timeout: ${USER_IMAGE_TIMEOUT:5s}
  mongodb:
    collection-prefix: ${USER_MONGO_COLLECTION_PREFIX:tbl_}
  role-grant:
    lease-duration: ${USER_ROLE_GRANT_LEASE_DURATION:60s}
    wait-timeout: ${USER_ROLE_GRANT_WAIT_TIMEOUT:5s}
  keycloak-admin:
    base-url: ${USER_KEYCLOAK_ADMIN_BASE_URL:}
    realm: ${USER_KEYCLOAK_ADMIN_REALM:${KEYCLOAK_IDENTITY_REALM_ID:flash-ticket}}
    client-id: ${USER_KEYCLOAK_ADMIN_CLIENT_ID:user-management}
    client-secret: ${USER_KEYCLOAK_ADMIN_CLIENT_SECRET:}
    timeout: ${USER_KEYCLOAK_ADMIN_TIMEOUT:5s}
  identity:
    enabled: ${USER_IDENTITY_ENABLED:true}
    queue: ${USER_IDENTITY_QUEUE:user.identity.q}
    max-message-bytes: ${USER_IDENTITY_MAX_MESSAGE_BYTES:65536}
  recovery:
    enabled: ${USER_RECOVERY_ENABLED:true}
    delay: ${USER_RECOVERY_DELAY:30s}
    batch-size: ${USER_RECOVERY_BATCH_SIZE:20}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
