spring:
  data:
    mongodb:
      repositories:
        type: none
  application:
    name: user-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
# Test-only isolation: production configuration comes from Config Server and
# requires the real MongoDB and RabbitMQ endpoints.
  autoconfigure:
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
      - org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration

eureka:
  client:
    enabled: false

logging:
  charset:
    console: UTF-8
  structured:
    format:
      console: logstash
    json:
      # Native Boot filtering/renaming; never include arbitrary MDC fields.
      include: timestamp,level,message,stack_trace,schemaVersion,serviceName,serviceVersion,instanceId,environment,eventName,operation,outcome,errorCode,errorType,httpMethod,httpStatus,correlationId,requestId,orderId,messageId,causationId,sagaId,paymentAttemptId,chargeId,refundId,issuanceId,ticketId,traceId,spanId,stateBefore,stateAfter,reasonCode,durationMs,retryCount,configVersion
      rename:
        level: severity
        stack_trace: stackTrace
      add:
        serviceName: user-service
        serviceVersion: ${USER_SERVICE_VERSION:local-dev}
        instanceId: ${USER_INSTANCE_ID:${random.uuid}}
        environment: ${USER_ENVIRONMENT:local}
      customizer: com.flashticket.user_service.config.UserLogFields
      stacktrace:
        printer: com.flashticket.user_service.config.SafeStackTracePrinter
