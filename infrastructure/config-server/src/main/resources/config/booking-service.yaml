server:
  port: ${BOOKING_SERVICE_PORT:8082}

booking:
  expiry:
    enabled: true
    poll-interval: PT5S
    batch-size: 20
  outbox:
    enabled: true
    poll-interval: PT2S
    batch-size: 20
    confirm-timeout: PT5S
    retry-delay: PT5S
  reservation:
    hold-duration: PT15M
    lock-timeout: 5s

spring:
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USERNAME:booking_admin}
    password: ${BOOKING_DB_PASSWORD}
    hikari:
      connection-init-sql: SET ROLE booking_owner
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: booking_schema
        type:
          json_format_mapper: jackson3
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  rabbitmq:
    connection-timeout: 5s
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:flash_ticket_app}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    dynamic: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      exchange: ${RABBITMQ_BUSINESS_EXCHANGE:business.ex}
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
  security:
    oauth2:
      client:
        registration:
          internal:
            provider: keycloak
            client-id: internal-service
            client-secret: ${INTERNAL_SERVICE_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  cloud:
    openfeign:
      oauth2:
        enabled: false
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: none

logging:
  charset:
    console: UTF-8
  structured:
    format:
      console: logstash
    json:
      # Native Boot filtering/renaming; never include arbitrary MDC fields.
      include: timestamp,level,message,stack_trace,schemaVersion,serviceName,serviceVersion,instanceId,environment,eventName,operation,outcome,errorCode,errorType,httpMethod,httpStatus,correlationId,requestId,orderId,messageId,causationId,sagaId,paymentAttemptId,chargeId,refundId,issuanceId,ticketId,traceId,spanId,stateBefore,stateAfter,reasonCode,durationMs,retryCount,configVersion
      rename:
        level: severity
        stack_trace: stackTrace
      add:
        serviceName: booking-service
        serviceVersion: ${BOOKING_SERVICE_VERSION:local-dev}
        instanceId: ${BOOKING_INSTANCE_ID:${random.uuid}}
        environment: ${BOOKING_ENVIRONMENT:local}
      customizer: com.flashticket.booking_service.config.BookingLogFields
      stacktrace:
        printer: com.flashticket.booking_service.config.SafeStackTracePrinter
