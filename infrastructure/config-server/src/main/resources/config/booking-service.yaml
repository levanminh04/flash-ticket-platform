server:
  port: ${BOOKING_SERVICE_PORT:8082}

spring:
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USERNAME:booking_admin}
    password: ${BOOKING_DB_PASSWORD}
    hikari:
      connection-init-sql: SET ROLE booking_owner
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: booking_schema
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:flash_ticket_app}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    dynamic: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      exchange: ${RABBITMQ_BUSINESS_EXCHANGE:business.ex}
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
          audiences:
            - ${KEYCLOAK_AUDIENCE:flash-ticket-api}
