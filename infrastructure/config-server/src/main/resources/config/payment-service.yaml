server:
  port: ${PAYMENT_SERVICE_PORT:8083}

spring:
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment_schema
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME:payment_admin}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      connection-init-sql: SET ROLE payment_owner
      maximum-pool-size: 5
      minimum-idle: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:flash_ticket_app}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    dynamic: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      exchange: ${RABBITMQ_BUSINESS_EXCHANGE:business.ex}
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20

flashticket:
  payment:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
      audience: ${KEYCLOAK_AUDIENCE:flash-ticket-api}

vnpay:
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  server-ip: ${VNPAY_SERVER_IP:127.0.0.1}
  refund-create-by: ${VNPAY_REFUND_CREATE_BY:flash-ticket}
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL:}
  app-return-url: ${VNPAY_APP_RETURN_URL:flash-ticket://payment-return}
  version: 2.1.0
  command: pay
  currency-code: VND
  locale: vn

logging:
  charset:
    console: UTF-8
  structured:
    format:
      console: logstash
    json:
      # Native Boot filtering/renaming; never include arbitrary MDC fields.
      include: timestamp,level,message,stack_trace,schemaVersion,serviceName,serviceVersion,instanceId,environment,eventName,operation,outcome,errorCode,errorType,httpMethod,httpStatus,correlationId,requestId,orderId,messageId,causationId,sagaId,paymentAttemptId,chargeId,refundId,issuanceId,ticketId,traceId,spanId,stateBefore,stateAfter,reasonCode,durationMs,retryCount,configVersion
      rename:
        level: severity
        stack_trace: stackTrace
      add:
        serviceName: payment-service
        serviceVersion: ${PAYMENT_SERVICE_VERSION:local-dev}
        instanceId: ${PAYMENT_INSTANCE_ID:${random.uuid}}
        environment: ${PAYMENT_ENVIRONMENT:local}
