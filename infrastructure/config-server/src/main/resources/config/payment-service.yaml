server:
  port: ${PAYMENT_SERVICE_PORT:8083}

spring:
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment_schema
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

flashticket:
  payment:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
      audience: ${KEYCLOAK_AUDIENCE}
