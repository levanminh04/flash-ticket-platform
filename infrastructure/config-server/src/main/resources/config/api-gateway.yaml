server:
  port: ${API_GATEWAY_PORT:8081}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${GATEWAY_REDIS_TIMEOUT:10s}
      timeout: ${GATEWAY_REDIS_TIMEOUT:10s}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: ${INTEGRATION_GATEWAY_HTTP_RESPONSE_TIMEOUT:8s}
          discovery:
            locator:
              enabled: false

flashticket:
  gateway:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  structured:
    format:
      console: logstash

management:
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      eventServiceBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: COUNT_BASED
      bookingServiceBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: COUNT_BASED
      paymentServiceBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: COUNT_BASED
      ticketServiceBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: COUNT_BASED
      userServiceBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: COUNT_BASED
  timelimiter:
    instances:
      eventImageServiceBreaker:
        timeoutDuration: ${EVENT_IMAGES_GATEWAY_TIME_LIMIT:50s}
      eventServiceBreaker:
        timeoutDuration: ${INTEGRATION_EVENT_GATEWAY_TIME_LIMIT:25s}
      bookingServiceBreaker:
        timeoutDuration: ${INTEGRATION_BOOKING_GATEWAY_TIME_LIMIT:25s}
      paymentServiceBreaker:
        timeoutDuration: ${INTEGRATION_PAYMENT_GATEWAY_TIME_LIMIT:25s}
      ticketServiceBreaker:
        timeoutDuration: ${INTEGRATION_TICKET_GATEWAY_TIME_LIMIT:25s}
      userServiceBreaker:
        timeoutDuration: ${INTEGRATION_USER_GATEWAY_TIME_LIMIT:25s}

#registerHealthIndicator	                    Đưa trạng thái của Circuit Breaker này vào trang /actuator/health.
#slidingWindowSize: 10	                        Theo dõi kết quả của 10 cuộc gọi gần nhất để tính toán tỷ lệ lỗi.
#minimumNumberOfCalls: 5	                    Phải có ít nhất 5 cuộc gọi (SUCC or FAIL) thì mới bắt đầu tính toán để ngắt mạch.
#failureRateThreshold: 50	                    Nếu tỉ lệ lỗi >= 50%, mạch sẽ chuyển sang trạng thái OPEN (Ngắt).
#waitDurationInOpenState: 10s	                Sau khi ngắt, nó sẽ chờ 10 giây trước khi thử chuyển sang trạng thái Half-Open.
#permittedNumberOfCallsInHalfOpenState: 3	    Ở trạng thái Half-Open, cho phép 3 cuộc gọi để kiểm tra hệ thống đã ổn định chưa.
#automaticTransitionFromOpenToHalfOpenEnabled	Tự động chuyển từ OPEN sang Half-Open mà không cần có request mới đến.
