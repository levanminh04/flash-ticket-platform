spring:
  application:
    name: discovery-server

server:
  port: ${DISCOVERY_SERVER_PORT:8761}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  charset:
    console: UTF-8
  level:
    root: WARN
    com.flashticket: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.netflix: WARN
    io.lettuce: WARN
    org.apache: WARN
  structured:
    format:
      console: logstash
    json:
      customizer: com.flashticket.discovery_server.observability.LogFields
      stacktrace:
        printer: com.flashticket.discovery_server.observability.SafeStackTracePrinter
