name: CodeQL

on:
  workflow_call:
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

jobs:
  analyze:
    name: Analyze Java and Kotlin
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            infrastructure/api-gateway/pom.xml
            infrastructure/api-gateway/.mvn/wrapper/maven-wrapper.properties
            infrastructure/config-server/pom.xml
            infrastructure/config-server/.mvn/wrapper/maven-wrapper.properties
            infrastructure/discovery-server/pom.xml
            infrastructure/discovery-server/.mvn/wrapper/maven-wrapper.properties
            services/event-service/pom.xml
            services/event-service/.mvn/wrapper/maven-wrapper.properties
            services/booking-service/pom.xml
            services/booking-service/.mvn/wrapper/maven-wrapper.properties
            services/payment-service/pom.xml
            services/payment-service/.mvn/wrapper/maven-wrapper.properties
            services/ticket-service/pom.xml
            services/ticket-service/.mvn/wrapper/maven-wrapper.properties
            services/user-service/pom.xml
            services/user-service/.mvn/wrapper/maven-wrapper.properties

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile all independent Maven applications
        shell: bash
        run: |
          set -euo pipefail
          applications=(
            infrastructure/api-gateway
            infrastructure/config-server
            infrastructure/discovery-server
            services/event-service
            services/booking-service
            services/payment-service
            services/ticket-service
            services/user-service
          )
          for application in "${applications[@]}"; do
            chmod +x "$application/mvnw"
            (cd "$application" && ./mvnw -B -ntp -DskipTests compile)
          done

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
