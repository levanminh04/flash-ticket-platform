name: CodeQL

on:
  workflow_call:
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

jobs:
  analyze:
    name: Analyze Java and Kotlin
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile every application in services.json
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r path mvn; do
            if [[ $mvn == ./mvnw ]]; then chmod +x "$path/mvnw"; fi
            (cd "$path" && $mvn -B -ntp -DskipTests compile)
          done < <(jq -r '.services[] | select(.kind == "maven") | [.path, .mvn] | @tsv' .github/services.json)

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:java-kotlin
