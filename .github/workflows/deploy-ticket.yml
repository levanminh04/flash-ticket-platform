name: Deploy Ticket Service

on:
  push:
    branches: [dev/tuyen]
    paths:
      - services/ticket-service/**
      - deploy/deploy-ticket.sh
      - deploy/test_deploy_ticket.py
      - infrastructure/config-server/src/main/resources/config/ticket-service.yaml
      - deploy/docker-compose.ticket.yml
      - .github/workflows/deploy-ticket.yml
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: ticket-service-aws1
  cancel-in-progress: false

permissions: {}

env:
  TICKET_REPOSITORY: ghcr.io/levanminh04/flash-ticket-platform/ticket-service

jobs:
  build_publish:
    if: github.ref == 'refs/heads/dev/tuyen'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    services:
      ticket-postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: ticket_test_c1
          POSTGRES_USER: ticket_ci
          POSTGRES_PASSWORD: ticket_ci_disposable
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_ci -d ticket_test_c1"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/ticket-service/pom.xml
      - name: Check deploy CLI and isolated PostgreSQL behavior
        env:
          TICKET_TEST_DB_URL: jdbc:postgresql://127.0.0.1:15432/ticket_test_c1
          TICKET_TEST_DB_USER: ticket_ci
          TICKET_TEST_DB_PASSWORD: ticket_ci_disposable
        run: |
          bash -n deploy/deploy-ticket.sh
          python3 deploy/test_deploy_ticket.py
          cd services/ticket-service
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=TicketPostgresIT test
      - name: Verify Ticket
        env:
          JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
        working-directory: services/ticket-service
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Upload Ticket verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ticket-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            services/ticket-service/target/surefire-reports/**
            services/ticket-service/target/site/jacoco/**
          retention-days: 7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified runtime
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/ticket-service
          platforms: linux/amd64
          push: true
          tags: ${{ env.TICKET_REPOSITORY }}:sha-${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: build_publish
    if: github.ref == 'refs/heads/dev/tuyen'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy only Ticket on AWS1
        env:
          SSH_KEY: ${{ secrets.FT119_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.FT119_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.FT119_SSH_HOST }}
          SSH_USER: ${{ vars.FT119_SSH_USER }}
          SSH_PORT: ${{ vars.FT119_SSH_PORT }}
          DEPLOY_DIRECTORY: /home/ubuntu/flash-ticket-ticket/deploy
          ENV_FILE: /home/ubuntu/flash-ticket-ticket/runtime/.env
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build_publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_DIRECTORY" =~ ^/[A-Za-z0-9_./-]+$ && "$DEPLOY_DIRECTORY" != *'/../'* ]]
          [[ "$ENV_FILE" =~ ^/[A-Za-z0-9_./-]+$ && "$ENV_FILE" != *'/../'* ]]
          # Use deploy/ directly; do not add a nested ticket-service directory.
          [[ "$DEPLOY_DIRECTORY" == "/home/$SSH_USER/"* ]]
          [[ "$DEPLOY_DIRECTORY" == */deploy ]]
          [[ "$ENV_FILE" == "/home/$SSH_USER/"* && "$ENV_FILE" == */.env ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/ticket-ssh.XXXXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/"*
          options=(-i "$ssh_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          destination="$SSH_USER@$SSH_HOST"
          release_directory="$DEPLOY_DIRECTORY/releases/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${options[@]}" -p "$SSH_PORT" "$destination" "install -d -m 700 '$release_directory'"
          scp "${options[@]}" -P "$SSH_PORT" deploy/docker-compose.ticket.yml deploy/deploy-ticket.sh "$destination:$release_directory/"
          image="$TICKET_REPOSITORY@$IMAGE_DIGEST"
          printf '%s\n' "$REGISTRY_TOKEN" |
            ssh "${options[@]}" -p "$SSH_PORT" "$destination" \
              "bash '$release_directory/deploy-ticket.sh' --registry-user '$REGISTRY_USER' '$image' --revision '$GITHUB_SHA' --env-file '$ENV_FILE' --compose-file '$release_directory/docker-compose.ticket.yml'"
          printf 'Ticket image: %s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          printf 'Ticket revision: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
