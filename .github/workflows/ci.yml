name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.detect.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Map the diff to services
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || '0000000000000000000000000000000000000000' }}
        run: bash .github/scripts/detect-changes.sh "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  maven:
    name: Maven / ${{ matrix.service.name }}
    needs: detect
    if: ${{ needs.detect.outputs.services != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_maven-verify.yml
    with:
      name: ${{ matrix.service.name }}
      path: ${{ matrix.service.path }}
      mvn: ${{ matrix.service.mvn }}
      postgres: ${{ matrix.service.postgres }}

  scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck --severity=warning deploy/scripts/*.sh .github/scripts/*.sh

  dependency_review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  required:
    name: Required
    if: ${{ always() }}
    needs: [detect, maven, scripts, dependency_review, codeql]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required CI results
        shell: bash
        env:
          DETECT: ${{ needs.detect.result }}
          MAVEN: ${{ needs.maven.result }}
          SCRIPTS: ${{ needs.scripts.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          CODEQL: ${{ needs.codeql.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          failed=0
          check() { [[ $2 == success ]] || { echo "$1 did not succeed: $2"; failed=1; }; }
          check "Change detection" "$DETECT"
          check "Deploy scripts" "$SCRIPTS"
          check "CodeQL" "$CODEQL"
          # Maven is skipped when no service changed.
          [[ $MAVEN == success || $MAVEN == skipped ]] || { echo "Maven verification did not succeed: $MAVEN"; failed=1; }
          if [[ $EVENT_NAME == pull_request ]]; then check "Dependency Review" "$DEPENDENCY_REVIEW"; fi
          exit "$failed"
