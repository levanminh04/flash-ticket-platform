name: Deploy User Service

on:
  workflow_dispatch:

concurrency:
  group: user-service-aws2
  cancel-in-progress: false

permissions: {}

env:
  USER_REPOSITORY: ghcr.io/levanminh04/flash-ticket-platform/user-service

jobs:
  build_publish:
    if: github.ref == 'refs/heads/dev/tuyen'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/user-service/pom.xml
      - name: Verify User
        working-directory: services/user-service
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Check deploy scripts
        run: |
          bash -n deploy/user-service/deploy-user.sh
          bash -n deploy/user-service/start-user-tunnel.sh
          python3 deploy/user-service/test_deploy_user.py
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified runtime
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/user-service
          platforms: linux/amd64
          push: true
          tags: ${{ env.USER_REPOSITORY }}:sha-${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: build_publish
    if: github.ref == 'refs/heads/dev/tuyen'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy only User on AWS2
        env:
          SSH_KEY: ${{ secrets.USER_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.USER_DEPLOY_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.USER_DEPLOY_SSH_HOST }}
          SSH_USER: ${{ vars.USER_DEPLOY_SSH_USER }}
          SSH_PORT: ${{ vars.USER_DEPLOY_SSH_PORT }}
          DEPLOY_DIRECTORY: ${{ vars.USER_DEPLOY_DIRECTORY }}
          ENV_FILE: ${{ vars.USER_DEPLOY_ENV_FILE }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build_publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_DIRECTORY" =~ ^/[A-Za-z0-9_./-]+$ && "$DEPLOY_DIRECTORY" != *'/../'* ]]
          [[ "$ENV_FILE" =~ ^/[A-Za-z0-9_./-]+$ && "$ENV_FILE" != *'/../'* ]]
          # Keep the provisioned remote release path; repository files live in deploy/user-service/.
          [[ "$DEPLOY_DIRECTORY" == "/home/$SSH_USER/"* && "$DEPLOY_DIRECTORY" == */deploy/user-service ]]
          [[ "$ENV_FILE" == "/home/$SSH_USER/"* && "$ENV_FILE" == */.env ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/user-ssh.XXXXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/"*
          options=(-i "$ssh_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          destination="$SSH_USER@$SSH_HOST"
          release_directory="$DEPLOY_DIRECTORY/releases/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${options[@]}" -p "$SSH_PORT" "$destination" "install -d -m 700 '$release_directory'"
          scp "${options[@]}" -P "$SSH_PORT" deploy/user-service/docker-compose.user.yml deploy/user-service/deploy-user.py deploy/user-service/deploy-user.sh "$destination:$release_directory/"
          image="$USER_REPOSITORY@$IMAGE_DIGEST"
          printf '%s\n' "$REGISTRY_TOKEN" |
            ssh "${options[@]}" -p "$SSH_PORT" "$destination" \
              "bash '$release_directory/deploy-user.sh' --registry-user '$REGISTRY_USER' '$image' --env-file '$ENV_FILE' --compose-file '$release_directory/docker-compose.user.yml'"
          printf 'User image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
