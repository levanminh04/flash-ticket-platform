apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-service-config
  namespace: flash-ticket
  labels:
    app.kubernetes.io/name: assistant-service
    app.kubernetes.io/part-of: flash-ticket
data:
  SERVER_ADDRESS: 0.0.0.0
  EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
  KEYCLOAK_ISSUER_URI: https://auth.flashticket.sondimid.cloud/realms/flash-ticket
  ASSISTANT_SERVICE_PORT: '8089'
  REDIS_HOST: 172.31.41.236
  REDIS_PORT: '6379'
  ASSISTANT_REDIS_KEY_PREFIX: 'flash-ticket:assistant:k8s:v1'
  ASSISTANT_EVENT_BASE_URL: http://event-service:8086
  ASSISTANT_BOOKING_BASE_URL: http://booking-service:8082
  ASSISTANT_MODEL_BASE_URL: https://model.sondimid.cloud/v1
  ASSISTANT_MODEL_NAME: gemini-3.8-flash-high
  SPRING_APPLICATION_JSON: >-
    {"server":{"shutdown":"graceful"},
    "spring":{"lifecycle":{"timeout-per-shutdown-phase":"60s"}},
    "management":{"endpoint":{"health":{"group":{"liveness":{"include":["livenessState"]},"readiness":{"include":["readinessState"]}}}}},
    "eureka":{"instance":{"prefer-ip-address":true,"ip-address":"${POD_IP}","instance-id":"${spring.application.name}:${POD_UID}","non-secure-port":"${server.port}"},
    "client":{"initial-instance-info-replication-interval-seconds":5}}}
