apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-service-config
  namespace: flash-ticket
  labels:
    app.kubernetes.io/name: assistant-service
    app.kubernetes.io/part-of: flash-ticket
data:
  SERVER_ADDRESS: 0.0.0.0
  EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
  KEYCLOAK_ISSUER_URI: https://auth.flashticket.sondimid.cloud/realms/flash-ticket
  ASSISTANT_SERVICE_PORT: '8089'
  REDIS_HOST: 172.31.41.236
  REDIS_PORT: '6379'
  ASSISTANT_REDIS_KEY_PREFIX: 'flash-ticket:assistant:k8s:v1'
  ASSISTANT_EVENT_BASE_URL: http://event-service:8086
  ASSISTANT_BOOKING_BASE_URL: http://booking-service:8082
  ASSISTANT_MODEL_BASE_URL: https://model.sondimid.cloud/v1
  ASSISTANT_MODEL_NAME: gemini-3.8-flash-high
  SPRING_APPLICATION_JSON: >-
    {"server":{"shutdown":"graceful"},
    "spring":{"lifecycle":{"timeout-per-shutdown-phase":"60s"}},
    "management":{"endpoint":{"health":{"group":{"liveness":{"include":["livenessState"]},"readiness":{"include":["readinessState"]}}}}},
    "eureka":{"instance":{"prefer-ip-address":true,"ip-address":"${POD_IP}","instance-id":"${spring.application.name}:${POD_UID}","non-secure-port":"${server.port}"},
    "client":{"initial-instance-info-replication-interval-seconds":5}}}
  # OpenTelemetry Java agent (deploy/observability/README.md). Agent đang tắt (OTEL_AGENT_ENABLED="false"
  # trong deployment.yaml); các biến OTEL_* dưới chỉ agent đọc. otel-collector: Service trong cụm, thêm khi bật.
  ENVIRONMENT: production
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: '0.1'
  OTEL_METRICS_EXPORTER: otlp
  OTEL_METRICS_EXEMPLAR_FILTER: always_off
  OTEL_LOGS_EXPORTER: none
  OTEL_INSTRUMENTATION_COMMON_LOGGING_TRACE_ID_KEY: traceId
  OTEL_INSTRUMENTATION_COMMON_LOGGING_SPAN_ID_KEY: spanId
  OTEL_INSTRUMENTATION_SANITIZATION_URL_EXPERIMENTAL_SENSITIVE_QUERY_PARAMETERS: q,vnp_Amount,vnp_BankCode,vnp_Command,vnp_CreateBy,vnp_CreateDate,vnp_CurrCode,vnp_ExpireDate,vnp_IpAddr,vnp_Locale,vnp_Message,vnp_OrderInfo,vnp_OrderType,vnp_PayDate,vnp_PromotionAmount,vnp_PromotionCode,vnp_RequestId,vnp_ResponseCode,vnp_ResponseId,vnp_ReturnUrl,vnp_SecureHash,vnp_SecureHashType,vnp_TmnCode,vnp_TransactionDate,vnp_TransactionNo,vnp_TransactionStatus,vnp_TransactionType,vnp_TxnRef,vnp_Version
