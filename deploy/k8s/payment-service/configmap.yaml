apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: flash-ticket
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: flash-ticket
data:
  SERVER_ADDRESS: 0.0.0.0
  EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
  EUREKA_CLIENT_ENABLED: 'true'
  KEYCLOAK_ISSUER_URI: https://auth.flashticket.sondimid.cloud/realms/flash-ticket
  PAYMENT_SERVICE_PORT: '8083'
  RABBITMQ_HOST: 172.31.41.236
  RABBITMQ_PORT: '5672'
  RABBITMQ_USERNAME: flash_ticket_app
  RABBITMQ_VHOST: /
  RABBITMQ_BUSINESS_EXCHANGE: business.ex
  KEYCLOAK_TOKEN_URI: http://172.31.41.236:8080/realms/flash-ticket/protocol/openid-connect/token
  KEYCLOAK_JWK_SET_URI: http://172.31.41.236:8080/realms/flash-ticket/protocol/openid-connect/certs
  KEYCLOAK_AUDIENCE: flash-ticket-api
  PAYMENT_WORKER_ENABLED: 'true'
  VNPAY_API_URL: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
  VNPAY_PAYMENT_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  VNPAY_RETURN_URL: https://flashticket.sondimid.cloud/api/v1/payments/vnpay/return
  VNPAY_IPN_URL: https://flashticket.sondimid.cloud/api/v1/payments/vnpay/ipn
  VNPAY_APP_RETURN_URL: flash-ticket://payment-return
  PAYMENT_BOOKING_DISCOVERY_ENABLED: 'true'
  SPRING_APPLICATION_JSON: '{"server":{"shutdown":"graceful"},"spring":{"lifecycle":{"timeout-per-shutdown-phase":"30s"},"cloud":{"loadbalancer":{"retry":{"enabled":false},"cache":{"enabled":false}}}},"management":{"endpoint":{"health":{"probes":{"enabled":true},"group":{"liveness":{"include":["livenessState"]},"readiness":{"include":["readinessState"]}}}}},"eureka":{"instance":{"prefer-ip-address":true,"ip-address":"${POD_IP}","instance-id":"${spring.application.name}:${POD_UID}","non-secure-port":"${server.port}"},"client":{"service-url":{"defaultZone":"http://discovery-server:8761/eureka/"},"registry-fetch-interval-seconds":5,"initial-instance-info-replication-interval-seconds":5}}}'
  # OpenTelemetry Java agent (deploy/observability/README.md). Agent đang tắt (OTEL_AGENT_ENABLED="false"
  # trong deployment.yaml); các biến OTEL_* dưới chỉ agent đọc. otel-collector: Service trong cụm, thêm khi bật.
  ENVIRONMENT: production
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: '0.1'
  OTEL_METRICS_EXPORTER: otlp
  OTEL_METRICS_EXEMPLAR_FILTER: always_off
  OTEL_LOGS_EXPORTER: none
  OTEL_INSTRUMENTATION_RABBITMQ_EXPERIMENTAL_SPAN_ATTRIBUTES: 'true'
  OTEL_INSTRUMENTATION_SANITIZATION_URL_EXPERIMENTAL_SENSITIVE_QUERY_PARAMETERS: q,vnp_Amount,vnp_BankCode,vnp_Command,vnp_CreateBy,vnp_CreateDate,vnp_CurrCode,vnp_ExpireDate,vnp_IpAddr,vnp_Locale,vnp_Message,vnp_OrderInfo,vnp_OrderType,vnp_PayDate,vnp_PromotionAmount,vnp_PromotionCode,vnp_RequestId,vnp_ResponseCode,vnp_ResponseId,vnp_ReturnUrl,vnp_SecureHash,vnp_SecureHashType,vnp_TmnCode,vnp_TransactionDate,vnp_TransactionNo,vnp_TransactionStatus,vnp_TransactionType,vnp_TxnRef,vnp_Version
