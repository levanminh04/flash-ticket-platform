apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: flash-ticket
  labels: &id001
    app.kubernetes.io/name: event-service
    app.kubernetes.io/part-of: flash-ticket
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-service
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: event-service
            namespaces:
            - flash-ticket
            topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: event-service
        image: ghcr.io/levanminh04/flash-ticket-platform/event-service:render-required
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8086
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 512Mi
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        envFrom:
        - configMapRef:
            name: event-service-config
        - secretRef:
            name: event-service-secret
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - |
              curl -fsS --max-time 2 http://127.0.0.1:8086/actuator/health/readiness >/dev/null
              curl -fsS --max-time 2 -H "Accept: application/json" "${EUREKA_SERVER_URL%/}/apps/EVENT-SERVICE/event-service:${POD_UID}" | jq -e --arg id "event-service:${POD_UID}" --arg ip "$POD_IP" ' .instance | .status == "UP" and .instanceId == $id and .ipAddr == $ip ' >/dev/null
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -ec
              - |
                # Đưa instance ra khỏi registry, chờ client bỏ địa chỉ rồi mới shutdown.
                result=0
                curl -fsS --max-time 4 --retry 3 --retry-delay 1 --retry-all-errors -X PUT "${EUREKA_SERVER_URL%/}/apps/EVENT-SERVICE/event-service:${POD_UID}/status?value=OUT_OF_SERVICE" >/dev/null || result=$?
                sleep 75
                exit "$result"
  minReadySeconds: 75
