apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-service-config
  namespace: flash-ticket
  labels:
    app.kubernetes.io/name: ticket-service
    app.kubernetes.io/part-of: flash-ticket
data:
  SERVER_ADDRESS: 0.0.0.0
  EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
  EUREKA_CLIENT_ENABLED: 'true'
  KEYCLOAK_ISSUER_URI: http://52.64.237.84:8080/realms/flash-ticket
  TICKET_SERVICE_PORT: '8084'
  RABBITMQ_HOST: 172.31.41.236
  RABBITMQ_PORT: '5672'
  RABBITMQ_USERNAME: flash_ticket_app
  RABBITMQ_VHOST: /
  RABBITMQ_BUSINESS_EXCHANGE: business.ex
  TICKET_DB_URL: jdbc:postgresql://172.31.41.236:5432/ticket_db
  TICKET_DB_USERNAME: ticket_admin
  KEYCLOAK_JWK_SET_URI: http://172.31.41.236:8080/realms/flash-ticket/protocol/openid-connect/certs
  KEYCLOAK_AUDIENCE: flash-ticket-api
  TICKET_BUSINESS_ENABLED: 'true'
  TICKET_LISTENERS_ENABLED: 'true'
  TICKET_WORKERS_ENABLED: 'true'
  TICKET_QR_KEY_RING_LOCATION: file:/run/ticket-qr/key-ring.json
  TICKET_QR_ACTIVE_KEY_VERSION: v1
  TICKET_BUYER_BASE_URL: ''
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: '587'
  MAIL_SMTP_AUTH: 'true'
  MAIL_SMTP_STARTTLS_ENABLE: 'true'
  MAIL_SMTP_STARTTLS_REQUIRED: 'true'
  SPRING_APPLICATION_JSON: '{"server":{"shutdown":"graceful"},"spring":{"lifecycle":{"timeout-per-shutdown-phase":"30s"},"cloud":{"loadbalancer":{"retry":{"enabled":false}}}},"management":{"endpoint":{"health":{"probes":{"enabled":true},"group":{"liveness":{"include":["livenessState"]},"readiness":{"include":["readinessState"]}}}}},"eureka":{"instance":{"prefer-ip-address":true,"ip-address":"${POD_IP}","instance-id":"${spring.application.name}:${POD_UID}","non-secure-port":"${server.port}"},"client":{"service-url":{"defaultZone":"http://discovery-server:8761/eureka/"}}}}'
