apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: discovery-server
  namespace: flash-ticket
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: flash-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-server
      flash-ticket/discovery-generation: peers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-server
        app.kubernetes.io/part-of: flash-ticket
        flash-ticket/discovery-generation: peers
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: discovery-server
        image: ghcr.io/levanminh04/flash-ticket-platform/discovery-server:render-required
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8761
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 384Mi
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: HOST_ID  # host.id của OpenTelemetry/B16: node chạy pod
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_AGENT_ENABLED  # tắt cứng: env thắng ConfigMap; chưa có cấu hình agent cho Discovery
          value: "false"
        envFrom:
        - configMapRef:
            name: discovery-server-config
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - |
              curl -fsS --max-time 2 http://127.0.0.1:8761/actuator/health/readiness >/dev/null
              curl -fsS --max-time 2 -H 'Accept: application/json' http://127.0.0.1:8761/eureka/apps |
                jq -e '.applications | type == "object"' >/dev/null
          periodSeconds: 5
          timeoutSeconds: 8
          failureThreshold: 36
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - |
              wget -q -T 2 -O /dev/null http://127.0.0.1:8761/actuator/health/readiness
              wget -q -T 2 -O /dev/null http://127.0.0.1:8761/eureka/apps
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            sleep:
              seconds: 15
  serviceName: discovery-server-peers
  podManagementPolicy: Parallel
  minReadySeconds: 30
  updateStrategy:
    type: RollingUpdate
