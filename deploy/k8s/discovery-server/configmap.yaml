apiVersion: v1
kind: ConfigMap
metadata:
  name: discovery-server-config
  namespace: flash-ticket
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: flash-ticket
data:
  SERVER_ADDRESS: 0.0.0.0
  DISCOVERY_SERVER_PORT: '8761'
  SPRING_APPLICATION_JSON: '{"server":{"shutdown":"graceful"},"spring":{"lifecycle":{"timeout-per-shutdown-phase":"30s"},"cloud":{"loadbalancer":{"retry":{"enabled":false}}}},"management":{"endpoint":{"health":{"probes":{"enabled":true},"group":{"liveness":{"include":["livenessState"]},"readiness":{"include":["readinessState"]}}}}}}'
