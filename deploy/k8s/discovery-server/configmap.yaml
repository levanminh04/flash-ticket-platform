apiVersion: v1
kind: ConfigMap
metadata:
  name: discovery-server-config
  namespace: flash-ticket
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: flash-ticket
data:
  SERVER_ADDRESS: 0.0.0.0
  DISCOVERY_SERVER_PORT: '8761'
  SPRING_APPLICATION_JSON: '{"server":{"shutdown":"graceful"},"spring":{"lifecycle":{"timeout-per-shutdown-phase":"30s"},"cloud":{"loadbalancer":{"retry":{"enabled":false}}}},"management":{"endpoint":{"health":{"probes":{"enabled":true},"group":{"liveness":{"include":["livenessState"]},"readiness":{"include":["readinessState"]}}}}},"eureka":{"instance":{"hostname":"${POD_NAME}.discovery-server-peers.flash-ticket.svc.cluster.local","instance-id":"${spring.application.name}:${POD_UID}","prefer-ip-address":false},"client":{"register-with-eureka":false,"fetch-registry":false,"registry-fetch-interval-seconds":5,"service-url":{"defaultZone":"http://discovery-server-0.discovery-server-peers.flash-ticket.svc.cluster.local:8761/eureka/"}},"server":{"use-read-only-response-cache":false}}}'
