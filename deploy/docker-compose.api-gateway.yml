name: flash-ticket-api-gateway

services:
  api-gateway:
    build:
      context: ../infrastructure/api-gateway
      dockerfile: Dockerfile
    env_file: ../.env
    network_mode: host
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
