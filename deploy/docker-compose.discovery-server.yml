name: flash-ticket-discovery-server

services:
  discovery-server:
    build:
      context: ../infrastructure/discovery-server
      dockerfile: Dockerfile
    env_file: ../.env
    network_mode: host
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
