name: flash-ticket-config-server

services:
  config-server:
    image: ${CONFIG_SERVER_IMAGE:-flash-ticket/config-server:local}
    build:
      context: ../infrastructure/config-server
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      SERVER_ADDRESS: 127.0.0.1
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=55.0 -Duser.timezone=UTC
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
