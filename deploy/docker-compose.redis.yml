services:
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the repository-root .env}
    command:
      - sh
      - -ec
      - exec /usr/local/bin/docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --raw PING | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticket

volumes:
  redis-data:

networks:
  ticket:
    name: flash-ticket-infra
