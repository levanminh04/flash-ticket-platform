name: flash-ticket-payment

services:
  payment-service:
    image: ${PAYMENT_IMAGE:-flash-ticket/payment-service:ff72b28}
    network_mode: host
    environment:
      SERVER_ADDRESS: 127.0.0.1
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT:-8083}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL:-http://127.0.0.1:8888}
      EUREKA_CLIENT_ENABLED: "false"
      PAYMENT_DB_URL: ${PAYMENT_DB_URL:?Set PAYMENT_DB_URL}
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME:-payment_admin}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD}
      BOOKING_SERVICE_URL: ${PAYMENT_DOCKER_BOOKING_URL:?Set PAYMENT_DOCKER_BOOKING_URL}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?Set KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:?Set KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-flash-ticket-api}
      PAYMENT_SERVICE_CLIENT_ID: ${PAYMENT_SERVICE_CLIENT_ID:-internal-service}
      PAYMENT_INTERNAL_SERVICE_CLIENT_SECRET: ${PAYMENT_INTERNAL_SERVICE_CLIENT_SECRET:-${PAYMENT_SERVICE_CLIENT_SECRET:?Set PAYMENT_INTERNAL_SERVICE_CLIENT_SECRET or PAYMENT_SERVICE_CLIENT_SECRET}}
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_INTERNAL_SERVICE_CLIENT_SECRET:-${PAYMENT_SERVICE_CLIENT_SECRET:-}}
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI:-${PAYMENT_SERVICE_TOKEN_URI:?Set KEYCLOAK_TOKEN_URI or PAYMENT_SERVICE_TOKEN_URI}}
      PAYMENT_SERVICE_TOKEN_URI: ${KEYCLOAK_TOKEN_URI:-${PAYMENT_SERVICE_TOKEN_URI:-}}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Set RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-flash_ticket_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_BUSINESS_EXCHANGE: ${RABBITMQ_BUSINESS_EXCHANGE:-business.ex}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:?Set VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:?Set VNPAY_HASH_SECRET}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: https://${NGROK_DOMAIN:?Set NGROK_DOMAIN}/api/v1/payments/vnpay/return
      VNPAY_IPN_URL: https://${NGROK_DOMAIN:?Set NGROK_DOMAIN}/api/v1/payments/vnpay/ipn
      VNPAY_APP_RETURN_URL: ${VNPAY_APP_RETURN_URL:-flash-ticket://payment-return}
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -XX:MaxRAMPercentage=60.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/api/v1/payments/vnpay/ipn | grep -q '\"RspCode\":\"97\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ngrok:
    image: ngrok/ngrok:latest@sha256:ff3b5c3674432d14a786349908b7bdf28ee56c25662637afcbe7180d471993ef
    network_mode: host
    command:
      - http
      - http://127.0.0.1:8083
      - --url=https://${NGROK_DOMAIN:?Set NGROK_DOMAIN}
      - --config=/etc/ngrok.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN}
    volumes:
      - ./ngrok/payment.yml:/etc/ngrok.yml:ro
    depends_on:
      payment-service:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
