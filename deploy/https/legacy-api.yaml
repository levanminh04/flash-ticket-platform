# Giữ upstream HTTP của Ngrok; không gắn middleware redirect vào route này.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-legacy-http
  namespace: flash-ticket
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: '1'
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8081
