name: flash-ticket-user

services:
  user-service:
    image: ${USER_IMAGE:?Set the verified User image digest}
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: ${USER_MEMORY_LIMIT:-384m}
    environment:
      JAVA_TOOL_OPTIONS: ${USER_JAVA_OPTIONS:--XX:MaxRAMPercentage=60.0 -Duser.timezone=UTC}
      SERVER_ADDRESS: ${USER_SERVER_ADDRESS:-127.0.0.1}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT:-8085}
      EUREKA_CLIENT_ENABLED: "${EUREKA_CLIENT_ENABLED:-false}"
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://127.0.0.1:8761/eureka/}
      USER_MONGO_URI: ${USER_MONGO_URI:?Set the User runtime MongoDB URI}
      MONGO_URI: ${USER_MONGO_URI}
      USER_RABBITMQ_HOST: ${USER_RABBITMQ_HOST:?Set the broker host}
      USER_RABBITMQ_PORT: ${USER_RABBITMQ_PORT:-5672}
      USER_RABBITMQ_USERNAME: ${USER_RABBITMQ_USERNAME:?Set the scoped broker user}
      USER_RABBITMQ_PASSWORD: ${USER_RABBITMQ_PASSWORD:?Set the broker credential}
      USER_RABBITMQ_VHOST: ${USER_RABBITMQ_VHOST:-/}
      RABBITMQ_HOST: ${USER_RABBITMQ_HOST}
      RABBITMQ_PORT: ${USER_RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${USER_RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${USER_RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${USER_RABBITMQ_VHOST:-/}
      USER_KEYCLOAK_ISSUER_URI: ${USER_KEYCLOAK_ISSUER_URI:?Set the exact token issuer}
      USER_KEYCLOAK_JWK_SET_URI: ${USER_KEYCLOAK_JWK_SET_URI:?Set the reachable JWKS URI}
      USER_KEYCLOAK_AUDIENCE: ${USER_KEYCLOAK_AUDIENCE:-flash-ticket-api}
      KEYCLOAK_ISSUER_URI: ${USER_KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${USER_KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_AUDIENCE: ${USER_KEYCLOAK_AUDIENCE:-flash-ticket-api}
      USER_KEYCLOAK_ADMIN_BASE_URL: ${USER_KEYCLOAK_ADMIN_BASE_URL:-}
      USER_KEYCLOAK_ADMIN_REALM: ${USER_KEYCLOAK_ADMIN_REALM:-}
      USER_KEYCLOAK_ADMIN_CLIENT_ID: ${USER_KEYCLOAK_ADMIN_CLIENT_ID:-user-management}
      USER_KEYCLOAK_ADMIN_CLIENT_SECRET: ${USER_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      USER_KEYCLOAK_ADMIN_TIMEOUT: ${USER_KEYCLOAK_ADMIN_TIMEOUT:-5s}
      USER_ROLE_GRANT_LEASE_DURATION: ${USER_ROLE_GRANT_LEASE_DURATION:-60s}
      USER_ROLE_GRANT_WAIT_TIMEOUT: ${USER_ROLE_GRANT_WAIT_TIMEOUT:-5s}
      USER_IMAGE_CLOUD_NAME: ${USER_IMAGE_CLOUD_NAME:-}
      USER_IMAGE_API_KEY: ${USER_IMAGE_API_KEY:-}
      USER_IMAGE_API_SECRET: ${USER_IMAGE_API_SECRET:-}
      USER_IMAGE_FOLDER: ${USER_IMAGE_FOLDER:-flash-ticket/organizers}
      USER_IDENTITY_ENABLED: "${USER_IDENTITY_ENABLED:-false}"
      USER_IDENTITY_QUEUE: ${USER_IDENTITY_QUEUE:-user.identity.q}
      USER_RECOVERY_ENABLED: "${USER_RECOVERY_ENABLED:-false}"
      USER_RECOVERY_DELAY: ${USER_RECOVERY_DELAY:-30s}
      USER_ENVIRONMENT: ${USER_ENVIRONMENT:-integration}
      USER_SERVICE_VERSION: ${USER_SERVICE_VERSION:-local-dev}
      USER_HOST_ID: ${USER_HOST_ID:-aws2}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
