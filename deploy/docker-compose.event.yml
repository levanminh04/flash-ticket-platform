name: flash-ticket-event

services:
  event-service:
    image: ${EVENT_IMAGE:?Set the verified Event image digest}
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: ${EVENT_MEMORY_LIMIT:-512m}
    environment:
      JAVA_TOOL_OPTIONS: ${EVENT_JAVA_OPTIONS:--XX:MaxRAMPercentage=50.0 -Duser.timezone=UTC}
      SERVER_ADDRESS: ${SERVER_ADDRESS:-${EVENT_SERVER_ADDRESS:-127.0.0.1}}
      EVENT_SERVICE_PORT: ${EVENT_SERVICE_PORT:-8086}
      EUREKA_CLIENT_ENABLED: "${EUREKA_CLIENT_ENABLED:-false}"
      EVENT_DB_URL: ${EVENT_DB_URL:?Set Event PostgreSQL JDBC URL}
      EVENT_DB_USERNAME: ${EVENT_DB_USERNAME:-event_admin}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD:?Set Event DB credential}
      EVENT_RABBITMQ_HOST: ${EVENT_RABBITMQ_HOST:-${RABBITMQ_HOST:?Set broker host}}
      EVENT_RABBITMQ_PORT: ${EVENT_RABBITMQ_PORT:-${RABBITMQ_PORT:-5672}}
      EVENT_RABBITMQ_USERNAME: ${EVENT_RABBITMQ_USERNAME:-${RABBITMQ_USERNAME:-flash_ticket_app}}
      EVENT_RABBITMQ_PASSWORD: ${EVENT_RABBITMQ_PASSWORD:-${RABBITMQ_PASSWORD:?Set publisher credential}}
      EVENT_RABBITMQ_VHOST: ${EVENT_RABBITMQ_VHOST:-${RABBITMQ_VHOST:-/}}
      EVENT_RABBITMQ_BUSINESS_EXCHANGE: ${EVENT_RABBITMQ_BUSINESS_EXCHANGE:-${RABBITMQ_BUSINESS_EXCHANGE:-business.ex}}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-${EVENT_RABBITMQ_HOST:?Set broker host}}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-${EVENT_RABBITMQ_PORT:-5672}}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-${EVENT_RABBITMQ_USERNAME:-flash_ticket_app}}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-${EVENT_RABBITMQ_PASSWORD:?Set publisher credential}}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-${EVENT_RABBITMQ_VHOST:-/}}
      RABBITMQ_BUSINESS_EXCHANGE: ${RABBITMQ_BUSINESS_EXCHANGE:-${EVENT_RABBITMQ_BUSINESS_EXCHANGE:-business.ex}}
      EVENT_KEYCLOAK_ISSUER_URI: ${EVENT_KEYCLOAK_ISSUER_URI:-${KEYCLOAK_ISSUER_URI:?Set exact JWT issuer}}
      EVENT_KEYCLOAK_JWK_SET_URI: ${EVENT_KEYCLOAK_JWK_SET_URI:-${KEYCLOAK_JWK_SET_URI:?Set reachable JWKS URI}}
      EVENT_KEYCLOAK_AUDIENCE: ${EVENT_KEYCLOAK_AUDIENCE:-${KEYCLOAK_AUDIENCE:-flash-ticket-api}}
      EVENT_KEYCLOAK_TOKEN_URI: ${EVENT_KEYCLOAK_TOKEN_URI:-${KEYCLOAK_TOKEN_URI:?Set internal token endpoint}}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-${EVENT_KEYCLOAK_ISSUER_URI:?Set exact JWT issuer}}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-${EVENT_KEYCLOAK_JWK_SET_URI:?Set reachable JWKS URI}}
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI:-${EVENT_KEYCLOAK_TOKEN_URI:?Set internal token endpoint}}
      EVENT_INTERNAL_SERVICE_CLIENT_SECRET: ${EVENT_INTERNAL_SERVICE_CLIENT_SECRET:?Set internal OAuth credential}
      EVENT_READ_MODEL_ENABLED: "${EVENT_READ_MODEL_ENABLED:-false}"
      EVENT_OUTBOX_ENABLED: "${EVENT_OUTBOX_ENABLED:-false}"
      EVENT_ENVIRONMENT: ${EVENT_ENVIRONMENT:-integration}
      EVENT_SERVICE_VERSION: ${EVENT_SERVICE_VERSION:-local-dev}
      EVENT_HOST_ID: ${EVENT_HOST_ID:-aws2}
      EVENT_IMAGES_CLOUD_NAME: ${EVENT_IMAGES_CLOUD_NAME:-}
      EVENT_IMAGES_API_KEY: ${EVENT_IMAGES_API_KEY:-}
      EVENT_IMAGES_API_SECRET: ${EVENT_IMAGES_API_SECRET:-}
      EVENT_IMAGES_FOLDER: ${EVENT_IMAGES_FOLDER:-flash-ticket/events}
      EVENT_IMAGES_MAX_BYTES: ${EVENT_IMAGES_MAX_BYTES:-5242880}
      EVENT_IMAGES_MAX_REQUEST_BYTES: ${EVENT_IMAGES_MAX_REQUEST_BYTES:-6291456}
      EVENT_IMAGES_MAX_PIXELS: ${EVENT_IMAGES_MAX_PIXELS:-16000000}
      EVENT_IMAGES_MAX_COUNT: ${EVENT_IMAGES_MAX_COUNT:-20}
      EVENT_IMAGES_TIMEOUT: ${EVENT_IMAGES_TIMEOUT:-10s}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
