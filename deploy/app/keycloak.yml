services:
  keycloak:
    image: ${IMAGE:?image digest required}
    command: [start, --import-realm]
    env_file: ../env/keycloak.env
    restart: unless-stopped
    mem_limit: 768m
    stop_grace_period: 30s
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - /opt/flash-ticket-infra/keycloak/keycloak/themes/flash-ticket:/opt/keycloak/themes/flash-ticket:ro
      - /opt/flash-ticket-infra/keycloak/keycloak/import:/opt/keycloak/data/import:ro
    networks: [infra]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  infra:
    name: flash-ticket-infra
    external: true
