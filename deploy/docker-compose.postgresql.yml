services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    shm_size: 256m
    stop_grace_period: 60s
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456789a}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    env_file:
      - ../services/event-service/.env.event-db
      - ../services/booking-service/.env.booking-db
      - ../services/payment-service/.env.payment-db
      - ../services/ticket-service/.env.ticket-db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/00-business-databases.sh:/docker-entrypoint-initdb.d/00-business-databases.sh:ro
      - ../docs/architecture/data/postgres:/opt/flash-ticket/postgres:ro
      - ../services/99-table-prefix.sql:/opt/flash-ticket/99-table-prefix.sql:ro
      - ../services/event-service/database/90-erd-reader.sql:/opt/flash-ticket/readers/event.sql:ro
      - ../services/booking-service/database/90-erd-reader.sql:/opt/flash-ticket/readers/booking.sql:ro
      - ../services/payment-service/database/90-erd-reader.sql:/opt/flash-ticket/readers/payment.sql:ro
      - ../services/ticket-service/database/90-erd-reader.sql:/opt/flash-ticket/readers/ticket.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ticket

volumes:
  postgres-data:

networks:
  ticket:
    name: flash-ticket-infra
