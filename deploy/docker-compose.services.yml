name: flash-ticket-services

# Run on server 119 (Linux); databases already bind to the host's loopback.
x-app: &app
  env_file: ../.env
  network_mode: host
  restart: unless-stopped
  mem_limit: 768m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  booking-service:
    <<: *app
    build:
      context: ../services/booking-service
      dockerfile: Dockerfile

  ticket-service:
    <<: *app
    build:
      context: ../services/ticket-service
      dockerfile: Dockerfile

  user-service:
    <<: *app
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
