name: flash-ticket-booking

services:
  booking-service:
    build:
      context: ../services/booking-service
      dockerfile: Dockerfile
    env_file: ../.env
    network_mode: host
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
